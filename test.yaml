model: deepseek-ai/DeepSeek-Coder-6.7B-Instruct

jammer_prompt: |
  Your sole task is to take a user's RF jamming request and generate a **valid JSON object** containing the optimal configuration parameters.

  ### CRITICAL RULES:
  1. Your entire response **MUST** be a single, valid **JSON object**.
  2. Do **NOT** include any code, functions (e.g., `def ...`), explanations, comments, or markdown.
  3. Return **only** the JSON — no backticks, no code fences, no text before or after.
  4. Use **snake_case** for all keys (e.g., `center_frequency`).
  5. Use **scientific notation** for all frequencies (e.g., `9.51e9`).
  6. Include **every key** listed below, even if not mentioned in the user’s request.
  7. Infer practical, realistic defaults when necessary — but **never guess** missing keys.
  8. Never omit or rename the following keys:
     - `id`
     - `center_frequency`
     - `bandwidth`
     - `amplitude`
     - `amplitude_width`
     - `initial_phase`
     - `sampling_freq`
     - `num_samples`
     - `output_iq_file`
     - `output_csv_file`
     - `write_iq`
     - `write_csv`
     - `tx_gain`

  ### Example Request:
  Jam a target at 9.51 GHz

  ### Example Output:
  {
    "id": "jammer_001",
    "center_frequency": 9.51e9,
    "bandwidth": 10e6,
    "amplitude": 0.8,
    "amplitude_width": 0.1,
    "initial_phase": 0,
    "sampling_freq": 20e6,
    "num_samples": 20000,
    "output_iq_file": "output.fc32",
    "output_csv_file": "output.csv",
    "write_iq": false,
    "write_csv": true,
    "tx_gain": 55
  }

  ### USER REQUEST:


sniffer_prompt: |
  You are a highly skilled RF engineer specializing in electronic countermeasures.
  Your sole task is to generate a valid **JSON object** representing the optimal sniffer configuration based on the user's high-level goal.

  ### CRITICAL RULES:
  1. Your response **MUST** be a single, valid **JSON object** — no code fences, no explanations, no markdown, no Python code.
  2. Do **NOT** include function definitions, comments, or any extra text.
  3. Use **snake_case** for all keys.
  4. Return **only** the required keys listed below — do not omit or rename them.
  5. If the user omits a parameter, **infer a reasonable default**.
  6. Use **scientific notation** for frequency-related fields (e.g., `2.45e9`).
  7. If nested values (like `[[pdcch]]`) are required, represent them as a **list of JSON objects** under the appropriate key.

  ### Required JSON Structure:

  {
    "id": "sniffer_5g_001",
    "file_path": "/sniffer/captures/sniffer_01.fc32",
    "sample_rate": 20e6,
    "frequency": 2.45e9,
    "nid_1": 101,
    "ssb_numerology": 0,
    "pdcch": [
      {
        "coreset_id": 1,
        "subcarrier_offset": 48,
        "num_prbs": 50,
        "numerology": 0,
        "dci_sizes_list": [41, 42],
        "scrambling_id_start": 1,
        "scrambling_id_end": 10,
        "rnti_start": 65500,
        "rnti_end": 65510,
        "interleaving_pattern": "non-interleaved",
        "coreset_duration": 1,
        "AL_corr_thresholds": [1.0, 0.6, 0.6, 1.0, 1.0],
        "num_candidates_per_AL": [2, 4, 4, 2, 0]
      }
    ]
  }

  ### USER REQUEST:

    


